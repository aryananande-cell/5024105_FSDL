<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Buttons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Bootstrap Buttons</h1>

        <!-- Basic Buttons -->
        <h3 class="mb-3">Basic Button Styles</h3>
        <div class="mb-4">
            <button class="btn btn-primary me-2">Primary</button>
            <button class="btn btn-secondary me-2">Secondary</button>
            <button class="btn btn-success me-2">Success</button>
            <button class="btn btn-danger me-2">Danger</button>
            <button class="btn btn-warning me-2">Warning</button>
            <button class="btn btn-info me-2">Info</button>
            <button class="btn btn-light me-2">Light</button>
            <button class="btn btn-dark">Dark</button>
        </div>

        <!-- Outline Buttons -->
        <h3 class="mb-3">Outline Buttons</h3>
        <div class="mb-4">
            <button class="btn btn-outline-primary me-2">Primary</button>
            <button class="btn btn-outline-secondary me-2">Secondary</button>
            <button class="btn btn-outline-success me-2">Success</button>
            <button class="btn btn-outline-danger">Danger</button>
        </div>

        <!-- Button Sizes -->
        <h3 class="mb-3">Button Sizes</h3>
        <div class="mb-4">
            <button class="btn btn-primary btn-lg me-2">Large</button>
            <button class="btn btn-primary me-2">Normal</button>
            <button class="btn btn-primary btn-sm">Small</button>
        </div>

        <!-- Block Buttons -->
        <h3 class="mb-3">Block Buttons</h3>
        <div class="mb-4">
            <button class="btn btn-primary w-100 mb-2">Full Width Button</button>
            <button class="btn btn-secondary w-100">Full Width Button</button>
        </div>

        <!-- Disabled State -->
        <h3 class="mb-3">Disabled Buttons</h3>
        <div class="mb-4">
            <button class="btn btn-primary me-2" disabled>Disabled</button>
            <button class="btn btn-outline-secondary" disabled>Disabled Outline</button>
        </div>

        <!-- Button with Icon -->
        <h3 class="mb-3">Buttons with Links</h3>
        <div>
            <a href="#" class="btn btn-primary me-2">Link Button</a>
            <input type="submit" class="btn btn-success me-2" value="Submit">
            <input type="reset" class="btn btn-warning" value="Reset">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
